<style>
.lf{--s:#38bdf8;--s2:#7dd3fc;--s3:#0ea5e9;--t:#e9f6ff;--m:#7f95aa;--ln:rgba(56,189,248,.22);--h:46px;--st:env(safe-area-inset-top,0px);width:92%;max-width:min(500px,100%);margin:18px auto;font-family:'Noto Sans KR',-apple-system,system-ui,sans-serif;color:var(--t);word-break:keep-all;-webkit-text-size-adjust:100%}
.lf,.lf *{box-sizing:border-box;min-width:0}
.lf-hd{position:fixed;top:0;left:0;right:0;height:calc(var(--h) + var(--st));padding:var(--st) 14px 0;z-index:2147483000;display:flex;align-items:center;justify-content:center;gap:7px;background:linear-gradient(180deg,#0d1622,#070b11);border-bottom:1px solid var(--ln);box-shadow:0 6px 24px rgba(0,0,0,.55),0 1px 0 rgba(56,189,248,.35)}
.lf-hd b{font-size:clamp(14px,4.2vw,17px);font-weight:900;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lf-dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--s);box-shadow:0 0 8px var(--s);animation:lf-bl 1.1s infinite}
.lf-sky{color:var(--s);font-weight:900;font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(56,189,248,.6);display:inline-block}
.lf-card{position:relative;display:grid;overflow:hidden;border-radius:20px;background:radial-gradient(120% 90% at 100% 0%,rgba(56,189,248,.16),rgba(56,189,248,0) 55%),linear-gradient(160deg,#111a25,#0b121b);border:1px solid var(--ln);box-shadow:0 18px 40px -16px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.05)}
.lf-ar{grid-area:1/1;width:100%;aspect-ratio:1/.6}
.lf-in{grid-area:1/1;display:flex;flex-direction:column;justify-content:space-between;gap:clamp(6px,1.8vw,10px);padding:clamp(12px,3.4vw,18px)}
.lf-top{flex:none;display:flex;align-items:center;gap:9px}
.lf-rule{flex:1;height:1px;background:linear-gradient(90deg,rgba(56,189,248,0),var(--ln))}
.lf-rule+.lf-bg+.lf-rule{background:linear-gradient(90deg,var(--ln),rgba(56,189,248,0))}
.lf-bg{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;background:rgba(56,189,248,.12);border:1px solid var(--ln);color:var(--s2);padding:5px 11px;font-size:clamp(11px,3vw,12.5px);font-weight:800;letter-spacing:-.3px;border-radius:99px;white-space:nowrap}
.lf-bg i{width:6px;height:6px;border-radius:50%;background:var(--s);box-shadow:0 0 8px var(--s);animation:lf-bl 1.1s infinite}
.lf-pn{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(11px,3.2vw,17px);padding:clamp(6px,1.6vw,12px) clamp(10px,3vw,16px);border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.07)}
.lf-num{flex:none;display:flex;align-items:baseline;justify-content:center;gap:5px;line-height:1}
.lf-num b{color:var(--s);font-size:clamp(34px,11vw,56px);font-weight:900;line-height:.9;letter-spacing:-2.5px;font-variant-numeric:tabular-nums;display:inline-block;text-shadow:0 0 26px rgba(56,189,248,.5)}
.lf-num span{color:var(--m);font-size:clamp(16px,4.6vw,22px);font-weight:700;letter-spacing:-.5px}
.lf-tr{flex:none;width:100%;height:clamp(8px,2.4vw,11px);min-height:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.06);border-radius:99px;overflow:hidden}
.lf-br{width:0;height:100%;min-height:6px;border-radius:99px;background:linear-gradient(90deg,var(--s3),var(--s2));box-shadow:0 0 14px rgba(56,189,248,.65);transition:width .9s cubic-bezier(.34,1.4,.64,1)}
.lf-bot{flex:none;display:flex;flex-direction:column;align-items:center;gap:clamp(2px,.8vw,4px)}
.lf-h1{font-size:clamp(15px,4.4vw,19px);font-weight:800;letter-spacing:-.6px;white-space:nowrap}
.lf-rm{color:var(--s);font-size:1.28em;font-weight:900;font-variant-numeric:tabular-nums;display:inline-block;animation:lf-gl 1.6s ease-in-out infinite}
.lf-ur{font-size:clamp(12px,3.4vw,14px);font-weight:900;letter-spacing:-.4px;color:var(--s2);white-space:nowrap;animation:lf-bl 1.3s infinite}
.lf-tm{font-size:clamp(9.5px,2.7vw,11px);font-weight:600;color:var(--m);font-variant-numeric:tabular-nums}
.lf-ts{position:fixed;top:calc(var(--h) + var(--st) + 10px);right:-110%;z-index:2147483001;display:flex;align-items:center;gap:10px;width:calc(100% - 32px);max-width:330px;padding:12px 15px;border-radius:14px;background:rgba(15,23,33,.97);border:1px solid var(--ln);box-shadow:0 14px 34px rgba(0,0,0,.6);transition:right .45s cubic-bezier(.22,1,.36,1),opacity .3s;opacity:0}
.lf-ts.on{right:16px;opacity:1}
.lf-ts i{flex:0 0 auto;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(56,189,248,.16);border:1px solid var(--ln);color:var(--s);font-style:normal;font-size:14px;font-weight:900}
.lf-ts p{font-size:clamp(12.5px,3.5vw,14px);font-weight:700;letter-spacing:-.3px;line-height:1.35}
.lf-ts p b{color:var(--s2);font-weight:900}
.lf-ts p span{display:block;margin-top:1px;font-size:clamp(10px,2.8vw,11px);font-weight:600;color:var(--m)}
@keyframes lf-bl{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes lf-gl{0%,100%{text-shadow:0 0 8px rgba(56,189,248,.45)}50%{text-shadow:0 0 16px rgba(56,189,248,.95)}}
@keyframes lf-pop{0%{transform:scale(1)}45%{transform:scale(1.28);filter:brightness(1.5)}100%{transform:scale(1)}}
@keyframes lf-fl{0%,100%{box-shadow:0 18px 40px -16px rgba(0,0,0,.9)}40%{box-shadow:0 18px 40px -16px rgba(0,0,0,.9),0 0 0 2px rgba(56,189,248,.55)}}
.lf-pop{animation:lf-pop .5s cubic-bezier(.175,.885,.32,1.275)}
.lf-fl{animation:lf-fl .6s ease-out}
@media(max-width:360px){.lf{width:94%}.lf-card{border-radius:16px}.lf-pn{border-radius:12px}}
@media(prefers-reduced-motion:reduce){.lf-dot,.lf-bg i,.lf-rm,.lf-ur,.lf-pop,.lf-fl{animation:none!important}}
</style>

<div class="lf">
  <header class="lf-hd"><i class="lf-dot"></i><b>선착순 (<span class="lf-sky" id="lf-hc">0</span>/<span id="lf-ht">0</span>)명 모집!</b></header>

  <div class="lf-card" id="lf-card">
    <i class="lf-ar"></i>
    <div class="lf-in">
    <div class="lf-top"><i class="lf-rule"></i><span class="lf-bg"><i></i>실시간 선착순 접수중</span><i class="lf-rule"></i></div>

    <div class="lf-pn">
      <div class="lf-num"><b id="lf-cur">0</b><span>/ <span id="lf-tot">0</span>명</span></div>
      <div class="lf-tr"><div class="lf-br" id="lf-bar"></div></div>
    </div>

    <div class="lf-bot">
      <div class="lf-h1">현재 선착순 <span class="lf-rm" id="lf-rem">0</span>명 남았습니다</div>
      <div class="lf-ur">⚡ 조기 마감 임박!</div>
      <div class="lf-tm">(최종 확인시간: <span id="lf-time">--:--:--</span>)</div>
    </div>
    </div>
  </div>

  <div class="lf-ts" id="lf-toast"><i>✓</i><p><b id="lf-name">박OO</b> 님이 방금 신청했습니다<span>방금 전 신청 완료</span></p></div>
</div>

<script>
(function(){
var C={total:20,start:14,end:18,min:5000,max:15000,first:2000,toast:3400,pad:true};
var r=document.querySelector('.lf:not([data-on])');if(!r)return;r.setAttribute('data-on','1');
var q=function(s){return r.querySelector(s)},
b=document.body,N='김이박최정강조윤장임한오서신권황안송류전',
cur=q('#lf-cur'),tot=q('#lf-tot'),rem=q('#lf-rem'),bar=q('#lf-bar'),tm=q('#lf-time'),
hc=q('#lf-hc'),ht=q('#lf-ht'),card=q('#lf-card'),ts=q('#lf-toast'),nm=q('#lf-name'),
T=Math.max(1,C.total),n=Math.min(C.start,T),E=Math.min(C.end,T),tid;
if(C.pad&&b&&!b.getAttribute('data-lf')){b.setAttribute('data-lf','1');
b.style.paddingTop='calc('+getComputedStyle(b).paddingTop+' + 56px + env(safe-area-inset-top,0px))';}
function p2(v){return(v<10?'0':'')+v}
function pop(e,c){e.classList.remove(c);void e.offsetWidth;e.classList.add(c)}
function clock(){var d=new Date();tm.textContent=p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())}
function draw(a){
cur.textContent=hc.textContent=n;tot.textContent=ht.textContent=T;
rem.textContent=Math.max(0,T-n);bar.style.width=Math.round(n/T*100)+'%';clock();
if(a){pop(hc,'lf-pop');pop(cur,'lf-pop');pop(rem,'lf-pop');pop(card,'lf-fl')}}
function toast(){nm.textContent=N[Math.floor(Math.random()*N.length)]+'OO';ts.classList.add('on');
clearTimeout(tid);tid=setTimeout(function(){ts.classList.remove('on')},C.toast)}
function next(d){if(n>=E)return;setTimeout(function(){n++;draw(1);toast();next()},d||Math.random()*(C.max-C.min)+C.min)}
draw(0);setInterval(clock,1000);next(C.first);
})();
</script>
