<!--
  리드팟 랜딩 HTML 블록용 — 플로팅 헤더 + 선착순 카드 + 실시간 접수 토스트
  디자인: 다크(검정) 배경 + 하늘색 포인트 / 모바일 퍼스트(≈375px 기준 설계)

  사용법
  1) 랜딩 편집기에서 "HTML 블록"을 추가하고 이 파일 내용을 통째로 붙여넣는다.
  2) 맨 아래 <script> 의 CONFIG 숫자만 바꾸면 인원·속도가 바뀐다.

  주의
  - HtmlBlock 이 이 블록의 CSS 를 블록 안으로 자동 격리한다(전역 리셋 금지 — 그래서 `*`·`body`
    셀렉터를 쓰지 않는다). @keyframes 는 격리되지 않으므로 이름을 전부 `lpfc-` 로 프리픽스했다.
  - 랜딩이 "구글 광고용(google_ads_safe)" 으로 설정되면 sanitizeHtml 이 <script> 를 제거한다.
    그 경우 숫자가 움직이지 않고 초기값만 보인다(마크업·디자인은 그대로).
  - position:fixed 는 조상에 transform/filter 가 걸려 있으면 그 조상 기준이 된다.
    헤더가 화면에 안 붙으면 이 블록을 감싸는 블록의 transform 을 확인한다.
-->

<style>
  .lpfc-root {
    /* ── 색상 토큰: 검정 배경 + 하늘색 포인트 ───────────────────── */
    --lpfc-sky: #38bdf8;
    --lpfc-sky-soft: #7dd3fc;
    --lpfc-sky-deep: #0ea5e9;
    --lpfc-bg: #070b11;
    --lpfc-card-a: #111a25;
    --lpfc-card-b: #0b121b;
    --lpfc-line: rgba(56, 189, 248, 0.22);
    --lpfc-text: #e9f6ff;
    --lpfc-muted: #7f95aa;
    --lpfc-track: rgba(255, 255, 255, 0.07);

    --lpfc-header-h: 46px;
    --lpfc-safe-top: env(safe-area-inset-top, 0px);

    width: 92%;
    max-width: min(500px, 100%);
    margin: 18px auto;
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    color: var(--lpfc-text);
    /* 모바일: 가로 스크롤·iOS 자동 글자 확대·한글 줄바꿈 깨짐 방지 */
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    word-break: keep-all;
    overflow-wrap: break-word;
  }

  .lpfc-root, .lpfc-root * { box-sizing: border-box; min-width: 0; }

  /* =========================================================
     1. 플로팅 헤더 (상단 고정) — 한 줄 컴팩트 / 노치 대응
     ========================================================= */
  .lpfc-header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: calc(var(--lpfc-header-h) + var(--lpfc-safe-top));
    padding: var(--lpfc-safe-top) 14px 0;
    z-index: 2147483000;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 7px;
    background: linear-gradient(180deg, #0d1622 0%, #070b11 100%);
    border-bottom: 1px solid var(--lpfc-line);
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.55), 0 1px 0 rgba(56, 189, 248, 0.35);
  }

  .lpfc-header-dot {
    flex: 0 0 auto;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--lpfc-sky);
    box-shadow: 0 0 8px var(--lpfc-sky);
    animation: lpfc-blink 1.1s infinite;
  }

  .lpfc-header-title {
    color: var(--lpfc-text);
    font-size: clamp(14px, 4.2vw, 17px);
    font-weight: 900;
    letter-spacing: -0.5px;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .lpfc-header-value {
    color: var(--lpfc-sky);
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
    display: inline-block;
  }

  /* =========================================================
     2. 선착순 카드 (가로:세로 = 1 : 0.6)
     ========================================================= */
  .lpfc-card {
    position: relative;
    aspect-ratio: 1 / 0.6;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: clamp(6px, 1.8vw, 10px);
    padding: clamp(12px, 3.4vw, 18px);
    border-radius: 20px;
    background:
      radial-gradient(120% 90% at 100% 0%, rgba(56, 189, 248, 0.16) 0%, rgba(56, 189, 248, 0) 55%),
      linear-gradient(160deg, var(--lpfc-card-a) 0%, var(--lpfc-card-b) 100%);
    border: 1px solid var(--lpfc-line);
    box-shadow: 0 18px 40px -16px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  /* 2-1. 윗줄: 좌우로 뻗는 가는 선 + 가운데 배지 → 카드 폭을 끝까지 쓴다 */
  .lpfc-row-top {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }

  .lpfc-badge-line {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .lpfc-rule {
    flex: 1 1 0;
    height: 1px;
    min-width: 0;
    background: linear-gradient(90deg, rgba(56, 189, 248, 0) 0%, var(--lpfc-line) 100%);
  }

  .lpfc-rule + .lpfc-badge + .lpfc-rule,
  .lpfc-badge + .lpfc-rule {
    background: linear-gradient(90deg, var(--lpfc-line) 0%, rgba(56, 189, 248, 0) 100%);
  }

  .lpfc-badge {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(56, 189, 248, 0.12);
    border: 1px solid var(--lpfc-line);
    color: var(--lpfc-sky-soft);
    padding: 5px 11px;
    font-size: clamp(11px, 3vw, 12.5px);
    font-weight: 800;
    letter-spacing: -0.3px;
    border-radius: 100px;
    white-space: nowrap;
  }

  .lpfc-badge-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--lpfc-sky);
    box-shadow: 0 0 8px var(--lpfc-sky);
    animation: lpfc-blink 1.1s infinite;
  }

  .lpfc-time {
    font-size: clamp(9.5px, 2.7vw, 11px);
    font-weight: 600;
    color: var(--lpfc-muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  /* 2-2. 가운데 패널: 폭을 꽉 채우는 카운터 판 — 가운데 정렬이어도 양옆이 비지 않는다 */
  .lpfc-panel {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(5px, 1.6vw, 9px);
    padding: clamp(8px, 2.4vw, 13px) clamp(10px, 3vw, 16px);
    border-radius: 14px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.045) 0%, rgba(255, 255, 255, 0.015) 100%);
    border: 1px solid rgba(255, 255, 255, 0.07);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  .lpfc-count-line {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 5px;
    line-height: 1;
  }

  .lpfc-current {
    color: var(--lpfc-sky);
    font-size: clamp(40px, 12.5vw, 60px);
    font-weight: 900;
    line-height: 0.9;
    letter-spacing: -2.5px;
    font-variant-numeric: tabular-nums;
    display: inline-block;
    text-shadow: 0 0 26px rgba(56, 189, 248, 0.5);
  }

  .lpfc-total {
    color: var(--lpfc-muted);
    font-size: clamp(16px, 4.6vw, 22px);
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  /* 2-3. 진행바 (패널 안, 폭 100%) */
  .lpfc-track {
    width: 100%;
    height: clamp(8px, 2.4vw, 11px);
    background: var(--lpfc-track);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 100px;
    overflow: hidden;
  }

  .lpfc-bar {
    width: 0%;
    height: 100%;
    border-radius: 100px;
    background: linear-gradient(90deg, var(--lpfc-sky-deep) 0%, var(--lpfc-sky-soft) 100%);
    box-shadow: 0 0 14px rgba(56, 189, 248, 0.65);
    transition: width 0.9s cubic-bezier(0.34, 1.4, 0.64, 1);
  }

  /* 2-4. 아랫줄: 문장형 안내 — 가로로 길어서 카드 폭을 자연스럽게 채운다 */
  .lpfc-row-bottom {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(2px, 0.8vw, 4px);
    width: 100%;
  }

  .lpfc-headline {
    font-size: clamp(15px, 4.4vw, 19px);
    font-weight: 800;
    letter-spacing: -0.6px;
    color: var(--lpfc-text);
    text-align: center;
    white-space: nowrap;
  }

  .lpfc-remaining {
    color: var(--lpfc-sky);
    font-size: 1.28em;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    display: inline-block;
    animation: lpfc-glow 1.6s ease-in-out infinite;
  }

  .lpfc-urgent {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: clamp(12px, 3.4vw, 14px);
    font-weight: 900;
    letter-spacing: -0.4px;
    color: var(--lpfc-sky-soft);
    white-space: nowrap;
    animation: lpfc-blink 1.3s infinite;
  }

  /* =========================================================
     3. 실시간 접수 토스트 (우측 상단)
     ========================================================= */
  .lpfc-toast {
    position: fixed;
    top: calc(var(--lpfc-header-h) + var(--lpfc-safe-top) + 10px);
    right: -110%;
    z-index: 2147483001;
    display: flex;
    align-items: center;
    gap: 10px;
    width: calc(100% - 32px);
    max-width: 330px;
    padding: 12px 15px;
    border-radius: 14px;
    background: linear-gradient(135deg, rgba(17, 26, 37, 0.97) 0%, rgba(11, 18, 27, 0.97) 100%);
    border: 1px solid var(--lpfc-line);
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(56, 189, 248, 0.08);
    transition: right 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
    opacity: 0;
  }

  .lpfc-toast.lpfc-show { right: 16px; opacity: 1; }

  .lpfc-toast-icon {
    flex: 0 0 auto;
    width: 26px; height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(56, 189, 248, 0.16);
    border: 1px solid var(--lpfc-line);
    color: var(--lpfc-sky);
    font-size: 14px;
    font-weight: 900;
  }

  .lpfc-toast-text {
    font-size: clamp(12.5px, 3.5vw, 14px);
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--lpfc-text);
    line-height: 1.35;
  }

  .lpfc-toast-name { color: var(--lpfc-sky-soft); font-weight: 900; }

  .lpfc-toast-sub {
    display: block;
    margin-top: 1px;
    font-size: clamp(10px, 2.8vw, 11px);
    font-weight: 600;
    color: var(--lpfc-muted);
  }

  /* =========================================================
     4. 애니메이션 (이름은 전역이므로 전부 lpfc- 프리픽스)
     ========================================================= */
  @keyframes lpfc-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  @keyframes lpfc-glow {
    0%, 100% { text-shadow: 0 0 8px rgba(56, 189, 248, 0.45); }
    50% { text-shadow: 0 0 16px rgba(56, 189, 248, 0.95); }
  }

  @keyframes lpfc-pop {
    0% { transform: scale(1); }
    45% { transform: scale(1.28); filter: brightness(1.5); }
    100% { transform: scale(1); }
  }

  @keyframes lpfc-card-flash {
    0%, 100% { box-shadow: 0 18px 40px -16px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.05); }
    40% { box-shadow: 0 18px 40px -16px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 0 0 2px rgba(56, 189, 248, 0.55); }
  }

  /* 동시 동기화 연출용 클래스 (JS 가 붙였다 뗀다) */
  .lpfc-animate-pop { animation: lpfc-pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  .lpfc-animate-flash { animation: lpfc-card-flash 0.6s ease-out; }

  /* 초소형 단말(≈320~360px)에서 카드가 답답해지지 않게 여백을 줄인다 */
  @media (max-width: 360px) {
    .lpfc-root { width: 94%; }
    .lpfc-card { border-radius: 16px; }
    .lpfc-panel { border-radius: 12px; }
    .lpfc-toast { padding: 10px 12px; gap: 8px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .lpfc-header-dot, .lpfc-badge-dot, .lpfc-remaining, .lpfc-urgent,
    .lpfc-animate-pop, .lpfc-animate-flash {
      animation: none !important;
    }
  }
</style>

<div class="lpfc-root">

  <!-- 1. 플로팅 헤더 — 한 줄: 선착순 (현재/전체)명 모집! -->
  <header class="lpfc-header">
    <span class="lpfc-header-dot"></span>
    <div class="lpfc-header-title">선착순 (<span class="lpfc-header-value" data-lpfc="header-current">0</span>/<span data-lpfc="header-total">0</span>)명 모집!</div>
  </header>

  <!-- 2. 선착순 카드 (1 : 0.6) -->
  <div class="lpfc-card" data-lpfc="card">
    <div class="lpfc-row-top">
      <div class="lpfc-badge-line">
        <span class="lpfc-rule"></span>
        <div class="lpfc-badge"><span class="lpfc-badge-dot"></span>실시간 선착순 접수중</div>
        <span class="lpfc-rule"></span>
      </div>
    </div>

    <div class="lpfc-panel">
      <div class="lpfc-count-line">
        <span class="lpfc-current" data-lpfc="current">0</span>
        <span class="lpfc-total">/ <span data-lpfc="total">0</span>명</span>
      </div>
      <div class="lpfc-track">
        <div class="lpfc-bar" data-lpfc="bar"></div>
      </div>
    </div>

    <div class="lpfc-row-bottom">
      <div class="lpfc-headline">현재 선착순 <span class="lpfc-remaining" data-lpfc="remaining">0</span>명 남았습니다</div>
      <div class="lpfc-urgent">⚡ 조기 마감 임박!</div>
      <div class="lpfc-time">(최종 확인시간: <span data-lpfc="time">--:--:--</span>)</div>
    </div>
  </div>

  <!-- 3. 실시간 접수 토스트 -->
  <div class="lpfc-toast" data-lpfc="toast">
    <div class="lpfc-toast-icon">✓</div>
    <div class="lpfc-toast-text">
      <span class="lpfc-toast-name" data-lpfc="toast-name">박OO</span> 님이 방금 신청했습니다
      <span class="lpfc-toast-sub">방금 전 신청 완료</span>
    </div>
  </div>

</div>

<script>
(function () {
  /* ===== 여기 숫자만 바꾸면 된다 ===================================== */
  var CONFIG = {
    total: 20,          // 전체 모집 인원
    startCount: 14,     // 시작 접수 인원
    endCount: 18,       // 여기까지 차면 멈춘다
    minDelay: 5000,     // 다음 접수까지 최소 대기(ms)
    maxDelay: 15000,    // 다음 접수까지 최대 대기(ms)
    firstDelay: 2000,   // 로드 후 첫 접수까지 대기(ms)
    toastMs: 3400,      // 토스트 노출 시간(ms)
    applyBodyPadding: true  // 고정 헤더에 가려지지 않게 본문 위쪽 여백 자동 확보
  };
  /* ================================================================= */

  // 같은 페이지에 블록이 여러 개여도 각자 한 번씩만 초기화되게 한다.
  var root = null;
  var roots = document.querySelectorAll('.lpfc-root');
  for (var i = 0; i < roots.length; i++) {
    if (!roots[i].getAttribute('data-lpfc-ready')) { root = roots[i]; break; }
  }
  if (!root) return;
  root.setAttribute('data-lpfc-ready', '1');

  function el(name) { return root.querySelector('[data-lpfc="' + name + '"]'); }

  var ui = {
    card: el('card'),
    current: el('current'),
    total: el('total'),
    remaining: el('remaining'),
    bar: el('bar'),
    time: el('time'),
    headerCurrent: el('header-current'),
    headerTotal: el('header-total'),
    toast: el('toast'),
    toastName: el('toast-name')
  };

  var total = Math.max(1, CONFIG.total);
  var current = Math.min(CONFIG.startCount, total);
  var endCount = Math.min(CONFIG.endCount, total);
  var toastTimer = null;

  /* ---- 고정 헤더에 본문이 가려지지 않게 (한 번만) ---- */
  if (CONFIG.applyBodyPadding) {
    var body = document.body;
    if (body && !body.getAttribute('data-lpfc-offset')) {
      body.setAttribute('data-lpfc-offset', '1');
      var cs = window.getComputedStyle(body);
      body.style.paddingTop = 'calc(' + (cs.paddingTop || '0px') + ' + 56px + env(safe-area-inset-top, 0px))';
    }
  }

  /* ---- 랜덤 이름 ---- */
  var LAST_NAMES = ['김', '이', '박', '최', '정', '강', '조', '윤', '장', '임',
                    '한', '오', '서', '신', '권', '황', '안', '송', '류', '전'];

  function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

  /* ---- 숫자 튀는 연출: 헤더와 카드에 동시에 건다 ---- */
  function pop(node, cls) {
    if (!node) return;
    cls = cls || 'lpfc-animate-pop';
    node.classList.remove(cls);
    void node.offsetWidth;   // 리플로우 강제 → 같은 애니메이션 재생
    node.classList.add(cls);
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function renderTime() {
    if (!ui.time) return;
    var d = new Date();
    ui.time.textContent = pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
  }

  /* ---- 헤더와 카드를 한 번에 갱신한다(동기화의 핵심) ---- */
  function render(animate) {
    var remaining = Math.max(0, total - current);
    var percent = Math.round((current / total) * 100);  // 진행바 폭

    if (ui.current) ui.current.textContent = current;
    if (ui.total) ui.total.textContent = total;
    if (ui.remaining) ui.remaining.textContent = remaining;
    if (ui.bar) ui.bar.style.width = percent + '%';
    // 헤더는 "선착순 (현재/전체)명 모집!" — 남은 자리로 바꾸고 싶으면 current 대신 remaining 을 넣는다.
    if (ui.headerCurrent) ui.headerCurrent.textContent = current;
    if (ui.headerTotal) ui.headerTotal.textContent = total;
    renderTime();

    if (animate) {
      pop(ui.headerCurrent);
      pop(ui.remaining);
      pop(ui.current);
      pop(ui.card, 'lpfc-animate-flash');
    }
  }

  function showToast() {
    if (!ui.toast) return;
    if (ui.toastName) ui.toastName.textContent = pick(LAST_NAMES) + 'OO';
    ui.toast.classList.add('lpfc-show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      ui.toast.classList.remove('lpfc-show');
    }, CONFIG.toastMs);
  }

  /* ---- 접수 1건 발생: 토스트 + 헤더 + 카드가 같은 순간에 움직인다 ---- */
  function register() {
    current += 1;
    render(true);
    showToast();
  }

  function scheduleNext(delay) {
    if (current >= endCount) return;
    var wait = typeof delay === 'number'
      ? delay
      : Math.floor(Math.random() * (CONFIG.maxDelay - CONFIG.minDelay + 1)) + CONFIG.minDelay;
    setTimeout(function () {
      register();
      scheduleNext();
    }, wait);
  }

  /* ---- 시작 ---- */
  render(false);
  setInterval(renderTime, 1000);   // "최종 확인" 시계는 계속 돈다
  scheduleNext(CONFIG.firstDelay);
})();
</script>
