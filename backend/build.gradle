plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.leadpot'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// 한글 소스 리터럴이 플랫폼 기본 인코딩(윈도우 MS949 등)으로 깨지지 않도록 UTF-8 고정
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'

	// 이미지 저장소: R2(S3 호환) — AWS SDK v2 S3. 미설정 시 로컬 디스크 사용.
	implementation platform('software.amazon.awssdk:bom:2.28.16')
	implementation 'software.amazon.awssdk:s3'

	// 엑셀(.xlsx) 양식 다운로드 / 리드 일괄 가져오기
	implementation 'org.apache.poi:poi-ooxml:5.3.0'

	// 구글시트 연동: 서비스 계정으로 Sheets API 직접 호출.
	// (예전엔 광고주 시트에 Apps Script 웹앱을 심었지만, 배포한 사람의 계정으로 실행돼
	//  그 사람이 시트 공유에서 빠지면 조용히 끊겼다. 2026-08-11 서비스 계정으로 교체.)
	implementation 'com.google.apis:google-api-services-sheets:v4-rev20220927-2.0.0'
	implementation 'com.google.auth:google-auth-library-oauth2-http:1.23.0'
	implementation 'com.google.api-client:google-api-client:2.2.0'

	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
