spring.application.name=leadpot-backend
server.port=8080

# CORS 허용 오리진 (콤마 구분). 배포 시 환경변수 APP_CORS_ALLOWED_ORIGINS 로 덮어쓴다.
# 예: https://app.도메인,https://leadpot.pages.dev
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# 공개 앱 주소(광고주 알림 메시지의 리드 상세 딥링크에 사용). 배포 시 APP_PUBLIC_BASE_URL 로 덮어쓴다.
app.public-base-url=${APP_PUBLIC_BASE_URL:https://app.lead-pot.com}

# Actuator (운영 헬스체크용)
management.endpoints.web.exposure.include=health,info

# --- Database (PostgreSQL) ---
# 로컬은 docker compose 의 db 컨테이너(localhost:5432)를 사용. 배포 시 환경변수로 덮어쓴다.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/leadpot}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:leadpot}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:leadpot}

# 커넥션 풀(HikariCP) — 기본값은 "DB 가 가까이 있다"는 전제라서 원격 DB 에 불리하다.
# 현재 DB 는 Neon ap-southeast-1(싱가포르)이고 앱은 서울이라 커넥션 하나 새로 맺는 값이 비싸다
# (2026-08-04 실측: 앱 자체 4ms / 쿼리 1회 170~280ms / 6분 유휴 뒤 첫 요청 740ms).
# 유휴 커넥션은 Neon 과 중간 NAT 이 끊어버리므로, 살아 있는 커넥션을 유지해 재수립 비용(+400ms)을 없앤다.
# ⚠️ 쿼리당 왕복 170~280ms 자체는 이 설정으로 줄지 않는다 — 그건 DB 를 서울로 옮겨야 해결된다.
# ⚠️ keepalive 는 주기적으로 DB 를 찔러 깨워두므로 Neon 무료 플랜의 월 컴퓨트 사용량이 늘 수 있다.
#    (실측상 6분 유휴로는 잠들지 않아 이미 상시 가동으로 보이지만, 요금 페이지에서 한 번 확인할 것)
spring.datasource.hikari.pool-name=leadpot-pool
# 유휴 커넥션을 이 주기로 찔러 살려둔다. max-lifetime 보다 반드시 작아야 한다.
spring.datasource.hikari.keepalive-time=${APP_DB_KEEPALIVE_MS:120000}
# 항상 살려둘 최소 커넥션 수. 기본값은 maximum-pool-size(10)와 같아 10개를 계속 찌르게 되어 과하다.
spring.datasource.hikari.minimum-idle=${APP_DB_MIN_IDLE:3}
spring.datasource.hikari.maximum-pool-size=${APP_DB_MAX_POOL:10}
# DB 가 커넥션을 먼저 끊기 전에 우리가 먼저 교체한다(기본 30분 → 25분).
spring.datasource.hikari.max-lifetime=${APP_DB_MAX_LIFETIME_MS:1500000}
# 풀에서 커넥션을 못 얻을 때 기다리는 시간(기본 30초). 싱가포르 왕복을 감안해도 10초면 충분하고,
# 넘어가면 사용자를 30초 붙잡아두지 말고 빠르게 실패시키는 게 낫다.
spring.datasource.hikari.connection-timeout=${APP_DB_CONNECTION_TIMEOUT_MS:10000}

# --- 운영자(어드민) ---
# 여기 적힌 이메일의 계정을 기동 시 ROLE_ADMIN 으로 올린다(AdminBootstrap).
# ⚠️ 이메일을 코드·git 에 두지 않기 위한 장치다 — 값은 VM 의 .env 에만 넣는다.
#    강등은 하지 않는다(설정을 실수로 비웠을 때 아무도 어드민에 못 들어가면 안 되므로).
app.admin.bootstrap-email=${APP_ADMIN_BOOTSTRAP_EMAIL:}

# --- 예열(warm-up) ---
# 기동 직후 공개 경로를 서버가 스스로 한 번씩 밟아 첫 방문자의 대기(2026-08-04 실측 6.8초)를 없앤다.
# 상세는 WarmupRunner 주석. 끄고 싶으면 APP_WARMUP_ENABLED=false.
app.warmup.enabled=${APP_WARMUP_ENABLED:true}

# --- 자동 승인 기간 (리드폼 설정) ---
# 리드폼에 '자동 승인 기간'이 켜져 있으면, 그 설정을 켠 뒤 접수된 리드 중 유예 기간이 지난
# 신규·상담중 건을 '완료'로 넘긴다. 상세는 LeadAutoApproveRunner 주석.
# ⚠️ 이 값을 끄면 리드폼 설정이 켜져 있어도 아무 일도 일어나지 않는다(운영 중 급히 멈출 때 사용).
app.lead.auto-approve.enabled=${APP_LEAD_AUTO_APPROVE_ENABLED:true}
# 매시 10분(KST). 설정 단위가 '일'이라 시간 단위면 충분하다.
# ⚠️ 주기를 짧게 하면 DB 왕복이 늘어난다 — 현재 DB 는 원격(Neon)이라 공짜가 아니다.
app.lead.auto-approve.cron=${APP_LEAD_AUTO_APPROVE_CRON:0 10 * * * *}

# JPA / Hibernate
# Phase 2부터 스키마는 Flyway 마이그레이션(db/migration)이 소유. Hibernate 는 검증만 수행.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true

# --- 파일 업로드 (이미지) ---
# 저장 위치: 로컬/VM 디스크(초기). 배포 시 볼륨 마운트, 후기 R2/S3로 교체.
app.uploads.dir=${APP_UPLOADS_DIR:./data/uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# 저장소 종류: local(기본, 디스크) | r2(Cloudflare R2, S3호환)
# r2 사용 시 아래 값들을 환경변수로 주입(코드/깃 커밋 금지):
app.storage.type=${APP_STORAGE_TYPE:local}
app.storage.r2.endpoint=${APP_STORAGE_R2_ENDPOINT:}
app.storage.r2.access-key=${APP_STORAGE_R2_ACCESS_KEY:}
app.storage.r2.secret-key=${APP_STORAGE_R2_SECRET_KEY:}
app.storage.r2.bucket=${APP_STORAGE_R2_BUCKET:}
app.storage.r2.public-base-url=${APP_STORAGE_R2_PUBLIC_BASE_URL:}

# --- JWT (HMAC HS256, Spring Security OAuth2 Resource Server) ---
# 운영에서는 반드시 APP_JWT_SECRET 환경변수로 32바이트 이상의 강한 시크릿을 주입한다. (아래는 로컬 개발 기본값)
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-please-change-in-prod-leadpot-hs256-0123456789}
app.jwt.issuer=leadpot
# --- 광고주 하위계정 ---
# 플랜별 광고주 계정 수 상한. 0 = 무제한. 결제 도입(Phase 7) 시 플랜 설정으로 이동.
# ⚠️ 2026-08-06: FREE 상한을 1 → 0(무제한)로 풀었다(사용자 결정). 결제·플랜을 아직 만들지 않아
#    상한만 먼저 걸려 있으면 실사용을 막을 뿐이다. 판정 코드(checkCanAddAdvertiser)는 그대로 두었으니
#    플랜 작업 때 이 값만 되돌리면 된다.
app.advertiser.max-free=${APP_ADVERTISER_MAX_FREE:0}
app.advertiser.max-pro=${APP_ADVERTISER_MAX_PRO:0}
# 초대 링크 유효시간(기본 7일)
app.advertiser.invite-ttl-hours=${APP_ADVERTISER_INVITE_TTL_HOURS:168}
# 비밀번호 재설정 링크 유효시간(기본 48시간 — 초대보다 짧게)
app.advertiser.password-reset-ttl-hours=${APP_ADVERTISER_PASSWORD_RESET_TTL_HOURS:48}
# 광고주 리드 내보내기 일일 횟수 상한(유출 방어). 0 이하면 무제한.
app.advertiser.export-daily-max=${APP_ADVERTISER_EXPORT_DAILY_MAX:20}

app.jwt.access-ttl-seconds=${APP_JWT_ACCESS_TTL:1800}
# 광고주 하위계정은 액세스 토큰을 더 짧게 준다(권한 회수·정지가 빨리 실효되도록).
app.jwt.advertiser-access-ttl-seconds=${APP_JWT_ADVERTISER_ACCESS_TTL:900}
app.jwt.refresh-ttl-seconds=${APP_JWT_REFRESH_TTL:1209600}
