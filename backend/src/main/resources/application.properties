spring.application.name=leadpot-backend
server.port=8080

# CORS 허용 오리진 (콤마 구분). 배포 시 환경변수 APP_CORS_ALLOWED_ORIGINS 로 덮어쓴다.
# 예: https://app.도메인,https://leadpot.pages.dev
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Actuator (운영 헬스체크용)
management.endpoints.web.exposure.include=health,info

# --- Database (PostgreSQL) ---
# 로컬은 docker compose 의 db 컨테이너(localhost:5432)를 사용. 배포 시 환경변수로 덮어쓴다.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/leadpot}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:leadpot}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:leadpot}

# JPA / Hibernate
# Phase 2부터 스키마는 Flyway 마이그레이션(db/migration)이 소유. Hibernate 는 검증만 수행.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true

# --- 파일 업로드 (이미지) ---
# 저장 위치: 로컬/VM 디스크(초기). 배포 시 볼륨 마운트, 후기 R2/S3로 교체.
app.uploads.dir=${APP_UPLOADS_DIR:./data/uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- JWT (HMAC HS256, Spring Security OAuth2 Resource Server) ---
# 운영에서는 반드시 APP_JWT_SECRET 환경변수로 32바이트 이상의 강한 시크릿을 주입한다. (아래는 로컬 개발 기본값)
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-please-change-in-prod-leadpot-hs256-0123456789}
app.jwt.issuer=leadpot
app.jwt.access-ttl-seconds=${APP_JWT_ACCESS_TTL:1800}
app.jwt.refresh-ttl-seconds=${APP_JWT_REFRESH_TTL:1209600}
