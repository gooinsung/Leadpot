spring.application.name=leadpot-backend
server.port=8080

# CORS 허용 오리진 (콤마 구분). 배포 시 환경변수 APP_CORS_ALLOWED_ORIGINS 로 덮어쓴다.
# 예: https://app.도메인,https://leadpot.pages.dev
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# 공개 앱 주소(광고주 알림 메시지의 리드 상세 딥링크에 사용). 배포 시 APP_PUBLIC_BASE_URL 로 덮어쓴다.
app.public-base-url=${APP_PUBLIC_BASE_URL:https://app.lead-pot.com}

# Actuator (운영 헬스체크용)
management.endpoints.web.exposure.include=health,info

# --- Database (PostgreSQL) ---
# 로컬은 docker compose 의 db 컨테이너(localhost:5432)를 사용. 배포 시 환경변수로 덮어쓴다.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/leadpot}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:leadpot}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:leadpot}

# JPA / Hibernate
# Phase 2부터 스키마는 Flyway 마이그레이션(db/migration)이 소유. Hibernate 는 검증만 수행.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true

# --- 파일 업로드 (이미지) ---
# 저장 위치: 로컬/VM 디스크(초기). 배포 시 볼륨 마운트, 후기 R2/S3로 교체.
app.uploads.dir=${APP_UPLOADS_DIR:./data/uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# 저장소 종류: local(기본, 디스크) | r2(Cloudflare R2, S3호환)
# r2 사용 시 아래 값들을 환경변수로 주입(코드/깃 커밋 금지):
app.storage.type=${APP_STORAGE_TYPE:local}
app.storage.r2.endpoint=${APP_STORAGE_R2_ENDPOINT:}
app.storage.r2.access-key=${APP_STORAGE_R2_ACCESS_KEY:}
app.storage.r2.secret-key=${APP_STORAGE_R2_SECRET_KEY:}
app.storage.r2.bucket=${APP_STORAGE_R2_BUCKET:}
app.storage.r2.public-base-url=${APP_STORAGE_R2_PUBLIC_BASE_URL:}

# --- JWT (HMAC HS256, Spring Security OAuth2 Resource Server) ---
# 운영에서는 반드시 APP_JWT_SECRET 환경변수로 32바이트 이상의 강한 시크릿을 주입한다. (아래는 로컬 개발 기본값)
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-please-change-in-prod-leadpot-hs256-0123456789}
app.jwt.issuer=leadpot
# --- 광고주 하위계정 ---
# 플랜별 광고주 계정 수 상한. 0 = 무제한. 결제 도입(Phase 7) 시 플랜 설정으로 이동.
app.advertiser.max-free=${APP_ADVERTISER_MAX_FREE:1}
app.advertiser.max-pro=${APP_ADVERTISER_MAX_PRO:0}
# 초대 링크 유효시간(기본 7일)
app.advertiser.invite-ttl-hours=${APP_ADVERTISER_INVITE_TTL_HOURS:168}
# 비밀번호 재설정 링크 유효시간(기본 48시간 — 초대보다 짧게)
app.advertiser.password-reset-ttl-hours=${APP_ADVERTISER_PASSWORD_RESET_TTL_HOURS:48}

app.jwt.access-ttl-seconds=${APP_JWT_ACCESS_TTL:1800}
# 광고주 하위계정은 액세스 토큰을 더 짧게 준다(권한 회수·정지가 빨리 실효되도록).
app.jwt.advertiser-access-ttl-seconds=${APP_JWT_ADVERTISER_ACCESS_TTL:900}
app.jwt.refresh-ttl-seconds=${APP_JWT_REFRESH_TTL:1209600}
