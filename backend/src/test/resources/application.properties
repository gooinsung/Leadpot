# 테스트 전용 설정 — 외부 PostgreSQL 없이 인메모리 H2로 컨텍스트를 로드한다.
# 주의: 파일명이 같으면 test 리소스가 main 의 application.properties 를 "덮어쓰지 않고 가린다".
#       따라서 컨텍스트가 필요로 하는 키(cors/jwt)를 여기서도 모두 정의해야 한다.
spring.datasource.url=jdbc:h2:mem:leadpot;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# 테스트는 Flyway(Postgres 전용 SQL) 대신 Hibernate 가 H2 스키마를 생성한다.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.cors.allowed-origins=http://localhost:5173

# 테스트용 고정 JWT 설정 (32바이트 이상)
app.jwt.secret=test-secret-for-junit-only-leadpot-hs256-key-0123456789
app.jwt.issuer=leadpot
# 광고주 하위계정 (테스트는 상한 검증을 위해 FREE=1 유지)
app.advertiser.max-free=1
app.advertiser.max-pro=0
app.advertiser.invite-ttl-hours=168

app.jwt.access-ttl-seconds=1800
app.jwt.advertiser-access-ttl-seconds=900
app.jwt.refresh-ttl-seconds=1209600

# 업로드 디렉터리(테스트 컨텍스트 로드용)
app.uploads.dir=./build/test-uploads
