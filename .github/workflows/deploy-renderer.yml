name: Deploy Renderer (Cloudflare Workers)

# renderer/** 또는 packages/public-ui/** 가 바뀌어 main 에 push 되면 공개 랜딩 SSR 렌더러를
# Cloudflare Workers 로 배포한다(docs/SSR-LANDING-PLAN.md Phase 5).
#
# ⚠️ 검증 단계 워크플로다 — 지금은 *.workers.dev 임시 도메인에만 배포된다. 실제 트래픽
# (*.lead-pot.com)은 Workers 라우트를 수동으로 연결하기 전까진 여기로 오지 않는다(사용자 작업,
# §8). 그 전까지는 이 워크플로가 돌아도 기존 서비스에 아무 영향이 없다.
#
# 필요한 저장소 시크릿(Settings → Secrets and variables → Actions → New repository secret):
#   CLOUDFLARE_API_TOKEN   — Account: Workers Scripts:Edit, Account Settings:Read 권한의 API 토큰
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare 대시보드 우측 사이드바에 있는 Account ID
on:
  push:
    branches: [main]
    paths:
      - 'renderer/**'
      - 'packages/public-ui/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-renderer.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-renderer
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # ⚠️ npm workspaces 라 설치는 반드시 저장소 루트에서 한다(deploy-frontend.yml 과 같은 이유).
      - name: 설치 (워크스페이스 루트)
        run: npm ci

      # opennextjs-cloudflare build 가 Next 빌드 + Workers 용 변환을, deploy 가 wrangler deploy 를
      # 대신 실행한다(renderer/package.json 의 "deploy" 스크립트). NEXT_PUBLIC_* 는 빌드 시점에
      # 번들에 박히므로(Vite 의 VITE_* 와 같은 원리) 여기서 프로덕션 값으로 넣어야 한다.
      - name: 빌드 + 배포 (OpenNext → Cloudflare Workers)
        working-directory: renderer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_API_BASE_URL: https://api.lead-pot.com
          NEXT_PUBLIC_APP_BASE_URL: https://app.lead-pot.com
        run: npm run deploy
