name: Deploy Backend

# backend/** 또는 compose 가 바뀌어 main 에 push 되면 VM 에서 git pull 후 컨테이너를 재빌드한다.
# 시크릿의 Neon/JWT 값은 VM 의 ~/Leadpot/.env(gitignore) 에 이미 있으므로 여기선 코드만 갱신한다.
# 필요한 저장소 시크릿: VM_SSH_KEY, VM_HOST, VM_USER
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 준비
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: VM 에서 pull + 재빌드 + 헬스체크
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" bash -s <<'REMOTE'
          set -e
          cd ~/Leadpot
          git pull --ff-only
          docker compose -f docker-compose.prod.yml up -d --build
          docker image prune -f >/dev/null 2>&1 || true
          echo "기동 대기..."
          for i in $(seq 1 24); do
            sleep 5
            if curl -sf -m 5 http://127.0.0.1:8080/api/health | grep -q UP; then
              echo "OK: 백엔드 UP"; exit 0
            fi
          done
          echo "헬스체크 실패(2분 초과)"; docker compose -f docker-compose.prod.yml logs --tail=40 backend; exit 1
          REMOTE
