name: Deploy Backend

# backend/** 또는 compose 가 바뀌어 main 에 push 되면 배포한다.
#
# ⚠️ 2026-08-05 구조 변경: **jar 을 러너에서 만든다.**
#   전에는 VM 안에서 Gradle 빌드를 돌려 배포에 10~17분이 걸렸고, 가용 메모리 약 220MB 라
#   빌드가 죽어 배포가 실패하기도 했다(84aa289). 이제 러너가 테스트+bootJar 를 돌리고
#   VM 은 jar 을 받아 실행만 한다 → 배포 2~3분, VM 메모리 부담 없음.
#
# 시크릿의 Neon/JWT 값은 VM 의 ~/Leadpot/.env(gitignore) 에 이미 있으므로 여기선 코드만 갱신한다.
# 필요한 저장소 시크릿: VM_SSH_KEY, VM_HOST, VM_USER
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 캐시
        uses: gradle/actions/setup-gradle@v4

      # 테스트를 여기서 돌린다 — 깨진 코드를 배포하지 않기 위해서다.
      # VM 에서 돌릴 때와 달리 러너는 넉넉해서 시간 부담이 거의 없다.
      #
      # ⚠️ gradlew 는 저장소에 실행권한 없이(100644) 커밋돼 있어 chmod 가 필요하다.
      #    기존 backend/Dockerfile 도 같은 이유로 `chmod +x gradlew` 를 하고 있었다.
      - name: 테스트 + jar 빌드
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew test bootJar --no-daemon

      # 이름을 고정한다 — Dockerfile.runtime 이 glob 없이 build/libs/app.jar 를 집는다.
      # (glob 을 쓰면 나중에 plain jar 이 함께 생길 때 조용히 잘못된 jar 을 담을 수 있다)
      - name: jar 이름 고정
        working-directory: backend
        run: |
          set -e
          count=$(ls build/libs/*.jar | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "예상과 다르게 jar 이 ${count}개 있습니다:"; ls -l build/libs
            exit 1
          fi
          mv build/libs/*.jar build/libs/app.jar
          ls -lh build/libs/app.jar

      - name: SSH 준비
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # jar 을 먼저 올린다. build/ 는 gitignore 라 뒤이은 git pull 이 지우지 않는다.
      - name: jar 전송
        run: |
          set -e
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            'mkdir -p ~/Leadpot/backend/build/libs'
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no \
            backend/build/libs/app.jar \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/Leadpot/backend/build/libs/app.jar"

      - name: VM 에서 pull + 컨테이너 교체 + 헬스체크
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" bash -s <<'REMOTE'
          set -e
          cd ~/Leadpot
          git pull --ff-only
          # jar 이 실제로 올라왔는지 확인한다 — 없으면 옛 이미지가 조용히 남는 것보다 실패가 낫다.
          test -f backend/build/libs/app.jar || { echo "app.jar 이 없습니다"; exit 1; }
          # 이제 --build 는 jar 을 COPY 하는 것뿐이라 몇 초면 끝난다.
          docker compose -f docker-compose.prod.yml up -d --build
          docker image prune -f >/dev/null 2>&1 || true
          echo "기동 대기..."
          # 기동은 약 90초 걸린다. 여유를 크게 둔다 — 배포 자체가 빨라졌으니 대기 시간은 싸다.
          for i in $(seq 1 36); do
            sleep 5
            if curl -sf -m 5 http://127.0.0.1:8080/api/health | grep -q UP; then
              echo "OK: 백엔드 UP"
              # 예열(warm-up)이 공개 경로를 데우는지 함께 확인한다 — 비동기라 조금 뒤에 찍힌다.
              sleep 10
              docker compose -f docker-compose.prod.yml logs --tail=200 backend | grep '\[warmup\]' || \
                echo "(참고: 예열 로그가 아직 없습니다)"
              exit 0
            fi
          done
          echo "헬스체크 실패(3분 초과)"; docker compose -f docker-compose.prod.yml logs --tail=60 backend; exit 1
          REMOTE
