name: Deploy Frontend

# frontend/** 가 바뀌어 main 에 push 되면 프론트를 빌드해 VM(Nginx 웹루트)로 배포한다.
# 필요한 저장소 시크릿: VM_SSH_KEY(CI 배포용 개인키), VM_HOST(공인 IP), VM_USER(ubuntu)
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build (프로덕션 API 주소 주입)
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.lead-pot.com
        run: |
          npm ci
          npm run build

      - name: SSH 준비
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: VM 웹루트로 배포 (rsync, 오래된 자산 정리)
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" \
            frontend/dist/ \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/var/www/leadpot/"
