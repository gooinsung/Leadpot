name: Deploy Frontend

# frontend/** 가 바뀌어 main 에 push 되면 프론트를 빌드해 VM(Nginx 웹루트)로 배포한다.
# 필요한 저장소 시크릿: VM_SSH_KEY(CI 배포용 개인키), VM_HOST(공인 IP), VM_USER(ubuntu)
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build (프로덕션 API·앱 주소 주입)
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.lead-pot.com
          # 동의문서 링크를 앱 도메인 절대 URL로 만든다(서브도메인·외부 임베드에서 404 방지, src/lib/site.ts)
          VITE_APP_BASE_URL: https://app.lead-pot.com
        run: |
          npm ci
          npm run build

      - name: SSH 준비
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # 무중단 배포: 해시된 새 자산을 먼저 올려두고(옛 자산 유지) → 마지막에 index.html 등 교체.
      # 이렇게 하면 배포 도중에도 옛 페이지가 참조하는 옛 자산이 남아 있어 화면이 깨지지 않는다.
      # (--delete 를 쓰지 않으므로 옛 자산은 누적되지만 해시명이라 무해. 필요 시 가끔 수동 정리.)
      - name: 새 자산 먼저 업로드 (옛 자산 유지)
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" \
            frontend/dist/assets/ \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/var/www/leadpot/assets/"

      - name: 나머지(index.html·embed.js 등) 교체
        run: |
          rsync -az --exclude 'assets/' \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" \
            frontend/dist/ \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/var/www/leadpot/"
