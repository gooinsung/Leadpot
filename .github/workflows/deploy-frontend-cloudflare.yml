name: Deploy Frontend (Cloudflare Pages)

# frontend/** 또는 packages/public-ui/** 가 바뀌어 main 에 push 되면 관리 앱을
# Cloudflare Pages 로도 배포한다(docs/SSR-LANDING-PLAN.md Phase 5 — HOSTING-MIGRATION-PLAN 흡수).
#
# 🔴 **이게 app.lead-pot.com 의 실제 배포 경로다**(2026-09-07 컷오버 완료). 나란히 도는
# deploy-frontend.yml(Oracle VM)은 트래픽을 안 받는 잔재이므로, 이 워크플로가 실패하면
# 관리 앱은 배포되지 않는다 — VM 쪽이 성공해도 소용없다(2026-09-22 실제로 겪음).
#
# 필요한 저장소 시크릿(Settings → Secrets and variables → Actions → New repository secret):
#   CLOUDFLARE_API_TOKEN   — Account: Cloudflare Pages:Edit 권한의 API 토큰
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare 대시보드 우측 사이드바에 있는 Account ID
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'packages/public-ui/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-frontend-cloudflare.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-frontend-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # ⚠️ npm workspaces 라 설치는 반드시 저장소 루트에서 한다.
      - name: 설치 (워크스페이스 루트)
        run: npm ci

      - name: Build (프로덕션 API·앱 주소 주입)
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.lead-pot.com
          # 동의문서 링크를 앱 도메인 절대 URL로 만든다(서브도메인·외부 임베드에서 404 방지)
          VITE_APP_BASE_URL: https://app.lead-pot.com
        run: npm run build

      # ⚠️ 예전엔 `cloudflare/pages-action@v1` 을 썼는데 Cloudflare 가 그 저장소를 없애서
      # 2026-09-22 배포가 "Unable to resolve action" 으로 죽었다. 서드파티 액션에 기대지 않고
      # deploy-renderer.yml 과 같은 방식(npx wrangler 직접 호출)으로 통일한다 — wrangler 는
      # 루트 node_modules 에 호이스팅돼 있어(renderer 의 devDependency) 버전이 고정된다.
      #
      # `--branch=main` 을 반드시 준다. 없으면 프리뷰 배포로 잡혀 app.lead-pot.com 이 안 바뀐다.
      - name: Cloudflare Pages 배포
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy frontend/dist --project-name=leadpot-app --branch=main
