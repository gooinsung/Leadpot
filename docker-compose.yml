# 로컬 개발용: PostgreSQL + 백엔드(Spring Boot) 동시 기동
# 사용: docker compose up   (백엔드 http://localhost:8080, DB localhost:5432)
# 참고: Phase 0 헬스체크는 DB 불필요. DB 연결은 Phase 1에서 백엔드에 추가한다.

services:
  db:
    # 운영(Railway Postgres)이 18 이므로 로컬도 18 로 맞춘다(2026-08-18).
    # 메이저 버전을 맞춰야 Flyway 마이그레이션·SQL 동작을 같은 조건에서 검증할 수 있다.
    image: postgres:18
    container_name: leadpot-db
    environment:
      POSTGRES_DB: leadpot
      POSTGRES_USER: leadpot
      POSTGRES_PASSWORD: leadpot
    ports:
      - "5432:5432"
    volumes:
      # ⚠️ postgres:18 부터 마운트 지점이 바뀌었다 — /var/lib/postgresql/data 가 아니라
      #    **/var/lib/postgresql** 에 하나만 걸고, 이미지가 그 아래 버전별 하위 디렉터리를
      #    만든다(pg_upgrade --link 를 쓸 수 있게 하려는 변경). 예전 경로로 걸면 기동이 실패한다.
      #    참고: https://github.com/docker-library/postgres/pull/1259
      # 또 16→18 은 메이저 업그레이드라 기존 데이터 디렉터리를 그대로 쓸 수 없다. 그래서
      # 옛 볼륨(leadpot_pgdata, PG16)은 **지우지 않고** 새 볼륨을 쓴다.
      # 옛 볼륨이 필요 없어지면:  docker volume rm leadpot_pgdata
      - pgdata_pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadpot"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: leadpot-backend
    ports:
      - "8080:8080"
    environment:
      APP_CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://db:5432/leadpot"
      SPRING_DATASOURCE_USERNAME: "leadpot"
      SPRING_DATASOURCE_PASSWORD: "leadpot"
      # 로컬 개발용 기본 시크릿. 운영 배포 시 반드시 강한 값으로 교체한다.
      APP_JWT_SECRET: "dev-only-secret-please-change-in-prod-leadpot-hs256-0123456789"
      # 업로드 이미지 저장 위치(컨테이너 내부) — 아래 볼륨에 영속. 후기 R2/S3로 교체.
      APP_UPLOADS_DIR: "/app/uploads"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata_pg18:
  uploads:
