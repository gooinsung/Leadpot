# 로컬 개발용: PostgreSQL + 백엔드(Spring Boot) 동시 기동
# 사용: docker compose up   (백엔드 http://localhost:8080, DB localhost:5432)
# 참고: Phase 0 헬스체크는 DB 불필요. DB 연결은 Phase 1에서 백엔드에 추가한다.

services:
  db:
    image: postgres:16
    container_name: leadpot-db
    environment:
      POSTGRES_DB: leadpot
      POSTGRES_USER: leadpot
      POSTGRES_PASSWORD: leadpot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadpot"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: leadpot-backend
    ports:
      - "8080:8080"
    environment:
      APP_CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      # Phase 1에서 DB 연결 추가 예정:
      # SPRING_DATASOURCE_URL: "jdbc:postgresql://db:5432/leadpot"
      # SPRING_DATASOURCE_USERNAME: "leadpot"
      # SPRING_DATASOURCE_PASSWORD: "leadpot"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
