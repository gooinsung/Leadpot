# Nginx 리버스 프록시 샘플 — api.<도메인> → 백엔드 컨테이너(127.0.0.1:8080)
# 설치 위치(우분투): /etc/nginx/sites-available/leadpot-api.conf  →  sites-enabled 로 심볼릭 링크
#   sudo ln -s /etc/nginx/sites-available/leadpot-api.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# SSL 은 Cloudflare(프록시 ON)가 처리 → 이 서버는 80 으로 받는다.
#   Cloudflare SSL/TLS 모드: 우선 "Flexible"(CF↔서버 HTTP)로 빠르게 시작,
#   이후 "Full"(오리진 인증서)로 강화 권장. 8080 은 방화벽/보안목록에서 열지 말 것.

server {
    listen 80;
    server_name api.example.com;   # <- 실제 도메인으로 교체 (예: api.lead-pot.com)

    # 업로드 파일 크기(이미지 5MB) 여유
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 리드 IP·차단·통계 정확도를 위해 원 방문자 IP 전달(백엔드가 X-Forwarded-For 첫 값 사용)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
